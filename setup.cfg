[metadata]
name = simple-auditlog
version = 0.1.0
description = A lightweight, explicit, and admin-friendly audit logging app for Django
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
author_email = you@example.com
license = MIT
keywords = django, audit, logging, admin, auditlog
classifiers =
    Framework :: Django
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = auditlog
install_requires =
    Django>=3.2
python_requires = >=3.8
include_package_data = true

[options.packages.find]
where = .
include = auditlog*
exclude = tests*

[options.extras_require]
dev =
    build
    twine

[options.package_data]
* = *.txt, *.md, *.rst, *.html, *.css, *.js, *.json, migrations/*.py

[bdist_wheel]
universal = 1
